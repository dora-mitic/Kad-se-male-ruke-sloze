<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kad se male ruke slože</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
  <script src="/static/confetti.js"></script>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">🤟</div>
      <h1>Kad se male ruke slože</h1>
    </div>
    <div class="header-right">
      <div id="anchor" class="pill pill-anchor" hidden></div>
      <div id="status" class="pill pill-wait">Pokrećem kameru…</div>
      <button id="settings-toggle" class="theme-toggle" type="button" title="Postavke"
              aria-expanded="false" aria-controls="settings">⚙️</button>
      <button id="theme-toggle" class="theme-toggle" type="button"></button>
    </div>

    <!-- Recognition settings: hold time and confidence threshold (settings.js) -->
    <section id="settings" class="settings" hidden>
      <h2>Postavke</h2>
      <label class="setting">
        <span class="setting-head">Vrijeme držanja slova <output id="confirm-value"></output></span>
        <input id="confirm-seconds" type="range" step="0.1">
        <span class="setting-hint">Koliko dugo treba držati znak da se upiše.</span>
      </label>
      <label class="setting">
        <span class="setting-head">Potrebna sigurnost <output id="confidence-value"></output></span>
        <input id="min-confidence" type="range" step="0.05">
        <span class="setting-hint">Niže = lakše prepoznaje, ali griješi češće.</span>
      </label>
      <button id="settings-reset" class="settings-reset" type="button">Zadano</button>
    </section>
  </header>

  <main>
    <div class="stage">
      <img id="video" src="/video" alt="Kamera">

      <div id="message" class="message" hidden></div>

      <!-- Reference sign preview (M8): PNG/GIF of the last recognised sign -->
      <aside id="sign-card" class="sign-card" hidden>
        <img id="sign-img" alt="">
      </aside>

      <!-- Live subtitles (M3/M7): the letter being read above, confirmed text below -->
      <div class="subtitle-area">
        <div id="reading" class="reading" hidden>
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle class="ring-track" cx="50" cy="50" r="44"></circle>
            <circle id="ring" class="ring-fill" cx="50" cy="50" r="44"></circle>
          </svg>
          <span id="reading-letter"></span>
        </div>
        <!-- Buttons on both sides so the subtitle box itself stays centred -->
        <div class="subtitle-row">
          <div class="sub-side sub-side-left">
            <button id="lock-btn" class="sub-btn" type="button" data-edit="lock" aria-pressed="false"
                    title="Zaključaj titlove (ne brišu se kad ruka ode)">🔓</button>
          </div>
          <div class="subtitles">
            <span id="subtitle-text" class="subtitle-placeholder">Ovdje će se pojaviti titlovi</span>
          </div>
          <div class="sub-side">
            <button class="sub-btn" type="button" data-edit="space" title="Razmak (razmaknica)">razmak</button>
            <button class="sub-btn" type="button" data-edit="backspace" title="Obriši zadnje slovo (Backspace)">⌫</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <span class="hint">Pokaži ruku kameri ✋</span>
    <span id="fps"></span>
  </footer>

  <script src="/static/app.js"></script>
  <script src="/static/settings.js"></script>
</body>
</html>
