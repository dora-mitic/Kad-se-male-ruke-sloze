<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kad se male ruke slože</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
  <script src="/static/confetti.js"></script>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">🤟</div>
      <h1>Kad se male ruke slože</h1>
    </div>
    <div class="header-right">
      <div id="anchor" class="pill pill-anchor" hidden></div>
      <div id="status" class="pill pill-wait">Pokrećem kameru…</div>
      <button id="theme-toggle" class="theme-toggle" type="button"></button>
    </div>
  </header>

  <main>
    <div class="stage">
      <img id="video" src="/video" alt="Kamera">

      <div id="message" class="message" hidden></div>

      <!-- Reference sign preview (M8): PNG/GIF of the last recognised sign -->
      <aside id="sign-card" class="sign-card" hidden>
        <img id="sign-img" alt="">
      </aside>

      <!-- Live subtitles (M3/M7) -->
      <div class="subtitles">
        <span id="subtitle-text" class="subtitle-placeholder">Ovdje će se pojaviti titlovi</span>
      </div>
    </div>
  </main>

  <footer>
    <span class="hint">Pokaži ruku kameri ✋</span>
    <span id="fps"></span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
